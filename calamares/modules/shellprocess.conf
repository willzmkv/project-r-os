---
# Calamares shellprocess module — Project-R post-install configuration
# Runs in the target root after package installation is complete.

dontChroot: false
timeout: 300

script:
  - "-/usr/bin/useradd -m -s /bin/bash -G wheel,audio,video,input,storage,optical arcade"
  - "passwd -d arcade"
  - "bash -c 'echo \"%wheel ALL=(ALL) NOPASSWD: ALL\" >> /etc/sudoers.d/wheel-nopasswd && chmod 440 /etc/sudoers.d/wheel-nopasswd'"
  - "bash -c 'mkdir -p /etc/systemd/system/getty@tty1.service.d && printf \"[Service]\\nExecStart=\\nExecStart=-/sbin/agetty --autologin arcade --noclear %%I \\$TERM\\n\" > /etc/systemd/system/getty@tty1.service.d/autologin.conf'"
  - "bash -c 'printf \"if [[ -z \\\"\\${DISPLAY}\\\" && \\\"\\${XDG_VTNR}\\\" == \\\"1\\\" ]]; then\\n    exec startx ~/.xinitrc\\nfi\\n\" > /home/arcade/.bash_profile'"
  - "bash -c 'printf \"#!/bin/bash\\npipewire &\\nwireplumber &\\nxset s off\\nxset -dpms\\nexec emulationstation --no-splash\\n\" > /home/arcade/.xinitrc && chmod +x /home/arcade/.xinitrc'"
  - "bash -c 'mkdir -p /home/arcade/.config/emulationstation && printf \"<?xml version=\\\"1.0\\\"?>\\n<config>\\n  <bool name=\\\"ShowSplashScreen\\\" value=\\\"false\\\" />\\n  <bool name=\\\"Windowed\\\" value=\\\"false\\\" />\\n</config>\\n\" > /home/arcade/.config/emulationstation/es_settings.xml'"
  - "systemctl enable NetworkManager pr-mediad pr-builder pr-meta pr-achieve pr-controller pr-maestro"
  - "chown -R arcade:arcade /home/arcade"
  - "flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo"
