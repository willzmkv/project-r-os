insmod part_gpt
insmod fat
insmod all_video

set default=0
set timeout=15

search --no-floppy --set=root --label %ARCHISO_LABEL%

menuentry "Project-R Arcade OS" {
    linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-cachyos archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% systemd.firstboot=off quiet loglevel=3
    initrd /%INSTALL_DIR%/boot/x86_64/initramfs-linux-cachyos.img
}

menuentry "Project-R Arcade OS (copy to RAM)" {
    linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-cachyos archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% systemd.firstboot=off copytoram quiet loglevel=3
    initrd /%INSTALL_DIR%/boot/x86_64/initramfs-linux-cachyos.img
}

menuentry "Reboot" {
    reboot
}

menuentry "Shut down" {
    halt
}
