UI menu.c32
PROMPT 0
MENU TITLE Project-R Arcade OS
TIMEOUT 30

LABEL project-r
  MENU LABEL Project-R Arcade OS
  LINUX boot/x86_64/vmlinuz-linux-cachyos
  INITRD boot/x86_64/initramfs-linux-cachyos.img
  APPEND archisobasedir=arch archisolabel=%ARCHISO_LABEL% quiet

LABEL project-r-fallback
  MENU LABEL Project-R (fallback initramfs)
  LINUX boot/x86_64/vmlinuz-linux-cachyos
  INITRD boot/x86_64/initramfs-linux-cachyos-fallback.img
  APPEND archisobasedir=arch archisolabel=%ARCHISO_LABEL%
